name: One Mind evolve

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_run:
    workflows: ["One Mind watch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      cycles:
        description: "Number of cycles"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: one-mind-evolve
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh to current main before computing
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Computing from $(git rev-parse --short HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cycles
        run: |
          PYTHONPATH=. python3 -m colony evolve --cycles ${{ github.event.inputs.cycles || 3 }} --offline
      - name: Snapshot before publish
        if: always()
        run: |
          mkdir -p /tmp/pre-publish
          cp -a data/commons /tmp/pre-publish/ 2>/dev/null || true
          git rev-parse HEAD > /tmp/pre-publish/HEAD
      - name: Upload pre-publish snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-publish-${{ github.run_id }}
          path: /tmp/pre-publish
      - name: Commit traces
        run: |
          git config user.name "James Jackson"
          git config user.email "jacksonjp0311-gif@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "one-mind cycle $(date -u +%Y-%m-%dT%H%MZ)"
          git pull --rebase origin main
          git push
      - name: Preserve traces on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-mind-traces-${{ github.run_id }}
          path: |
            data/commons/cycle_telemetry.jsonl
            data/commons/exchange.jsonl
            data/commons/adoption_feedback.jsonl
